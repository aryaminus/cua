[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cua"
version = "0.1.0"
description = "Computer-use automation: LLM discovers a flow once, artifacts replay it deterministically."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
  "flask>=3.0",
  "playwright>=1.49",
  "pydantic>=2.9",
  "httpx>=0.27",
  "python-dotenv>=1.0",
]

[dependency-groups]
dev = ["pytest>=8.0", "ruff>=0.6"]

[project.scripts]
cua = "cua.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["cua"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
"cua/mockapp.py" = ["E501"]
"cua/agent.py" = ["E501"]  # long prompt-string literals; code lines kept under 100
